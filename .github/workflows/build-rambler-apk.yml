
name: Build Rambler Bangla APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download private base APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download base-apk \
            --repo "$REPO" \
            --pattern base.apk \
            --output "$RUNNER_TEMP/base.apk"
          test -s "$RUNNER_TEMP/base.apk"
          sha256sum "$RUNNER_TEMP/base.apk"

      - name: Checkout Rambler source
        uses: actions/checkout@v4
        with:
          repository: muhib-karim/Rambler-Bangla
          path: source

      - name: Patch source for experimental build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/standalone-patcher/dex_patch.py")
          s = p.read_text(encoding="utf-8")

          old = 'return hashlib.sha256(s.encode("utf-8")).hexdigest()'
          new = 'return hashlib.sha256(s.encode("utf-8", "surrogatepass")).hexdigest()'
          assert s.count(old) == 1, "Unicode fix location changed"
          s = s.replace(old, new, 1)

          old = '''    for key, fp in profile.fingerprints.items():
          if not hits[key]:
              raise PatchError("fingerprint %s (%s) not found anywhere in the "
                               "APK; refusing to patch an unrecognized build"
                               % (fp["sha256"], key))'''
          new = '''    for key, fp in profile.fingerprints.items():
          if key == "lite_cleanup_prompt":
              print("WARNING: experimental bypass of lite_cleanup_prompt fingerprint")
              continue
          if not hits[key]:
              raise PatchError("fingerprint %s (%s) not found anywhere in the "
                               "APK; refusing to patch an unrecognized build"
                               % (fp["sha256"], key))'''
          assert s.count(old) == 1, "Fingerprint guard location changed"
          s = s.replace(old, new, 1)

          old = '''    raise PatchError("Lite cleanup prompt fingerprint %s not found in %s->%s"
                     % (fp, cls, name))'''
          new = '''    print("WARNING: prompt fingerprint absent; experimental test only")
          return True'''
          assert s.count(old) == 1, "Prompt verification location changed"
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("Experimental changes applied.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap tools
        working-directory: source
        run: |
          set -euo pipefail
          bash scripts/bootstrap_tools.sh

      - name: Build runtime DEX
        working-directory: source
        run: |
          set -euo pipefail
          source tools/tool-env.sh
          mkdir -p build/ext-classes build/ext-dex

          javac -d build/ext-classes \
            extension-src/com/akshaykadam/pixelboard/extension/ramblerlite/GboardRamblerLiteScriptRuntime.java

          java -cp tools/r8-8.3.37.jar \
            com.android.tools.r8.D8 \
            --min-api 24 \
            --output build/ext-dex \
            build/ext-classes/com/akshaykadam/pixelboard/extension/ramblerlite/*.class

          test -s build/ext-dex/classes.dex

      - name: Patch APK
        working-directory: source
        run: |
          set -euo pipefail
          source tools/tool-env.sh

          python3 standalone-patcher/dex_patch.py patch \
            --apk "$RUNNER_TEMP/base.apk" \
            --out "$RUNNER_TEMP/rambler-unsigned.apk" \
            --profile fingerprints/gboard-18.3.1.json \
            --workdir "$RUNNER_TEMP/patch-work" \
            --extension-dex build/ext-dex/classes.dex

          test -s "$RUNNER_TEMP/rambler-unsigned.apk"

      - name: Sign and verify APK
        working-directory: source
        run: |
          set -euo pipefail
          source tools/tool-env.sh

          key="$RUNNER_TEMP/rambler-test.jks"
          keytool -genkeypair \
            -keystore "$key" \
            -storepass changeit \
            -keypass changeit \
            -alias rambler \
            -dname "CN=Rambler Bangla Test" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          java -cp "$TOOLS_DIR/apksig-8.3.0.jar:$TOOLS_DIR/classes" \
            MiniApkSigner sign \
            "$key" changeit rambler changeit \
            "$RUNNER_TEMP/rambler-unsigned.apk" \
            "$RUNNER_TEMP/Rambler-Bangla.apk"

          java -cp "$TOOLS_DIR/apksig-8.3.0.jar:$TOOLS_DIR/classes" \
            MiniApkSigner verify "$RUNNER_TEMP/Rambler-Bangla.apk"

          test -s "$RUNNER_TEMP/Rambler-Bangla.apk"
          sha256sum "$RUNNER_TEMP/Rambler-Bangla.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rambler-Bangla-APK
          path: ${{ runner.temp }}/Rambler-Bangla.apk
          if-no-files-found: error
          retention-days: 3
